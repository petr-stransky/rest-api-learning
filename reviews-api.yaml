openapi: 3.0.3
info:
  title: Reviews API
  version: 1.0.0
paths:
  /reviews/{id}:
    get:
      summary: Detail recenze
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Recenze nalezena
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
  /reviews:
    get:
      summary: Seznam recenzí
      parameters:
        - name: min_rating
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        '200':
          description: Seznam recenzí
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
components:
  schemas:
    Review:
      type: object
      required: [id, rating]
      properties:
        id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        author:
          type: string
